name: KRYONIX
options:
  bundleIdPrefix: com.kryonix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  KRYONIX:
    type: application
    platform: iOS
    sources:
      - path: KRYONIX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kryonix.app
        PRODUCT_NAME: KRYONIX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KRYONIX
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "KRYONIX dùng vị trí khi bạn chủ động chia sẻ với người đã ghép đôi."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "KRYONIX cần quyền ảnh để bạn chọn ảnh cho album và story."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "KRYONIX cần quyền để lưu ảnh khi bạn yêu cầu."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "KRYONIX dùng micro khi bạn gửi tin nhắn thoại."
        TARGETED_DEVICE_FAMILY: "1"
