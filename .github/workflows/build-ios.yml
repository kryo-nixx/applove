name: Build KRYONIX Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build KRYONIX unsigned
        run: |
          xcodebuild \
            -project KRYONIX.xcodeproj \
            -scheme KRYONIX \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find KRYONIX.app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d -name "KRYONIX.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "KRYONIX.app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found: $APP_PATH"

      - name: Create unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          cp -R "$APP_PATH" \
            "$RUNNER_TEMP/ipa/Payload/KRYONIX.app"

          cd "$RUNNER_TEMP/ipa"

          zip -qry \
            "$RUNNER_TEMP/KRYONIX-unsigned.ipa" \
            Payload

          ls -lh "$RUNNER_TEMP/KRYONIX-unsigned.ipa"

      - name: Upload KRYONIX IPA
        uses: actions/upload-artifact@v4
        with:
          name: KRYONIX-Unsigned-IPA
          path: ${{ runner.temp }}/KRYONIX-unsigned.ipa
          if-no-files-found: error
